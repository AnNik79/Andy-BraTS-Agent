[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brats-debate"
version = "0.1.0"
description = "Research prototype for independent BraTS segmentation experts and learned gating"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "nibabel>=5.2", "numpy>=1.24", "scipy>=1.10", "pandas>=2", "matplotlib>=3.7", "scikit-learn>=1.3", "PyYAML>=6"]

[project.optional-dependencies]
monai = ["monai>=1.4,<2", "einops>=0.7"]
test = ["pytest>=8"]
performance = ["lz4>=4.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
