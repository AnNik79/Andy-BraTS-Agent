# BraTS 2023 GLI official TRAINING source only. Relative paths resolve from this YAML.
dataset_root: ../data/BraTS-GLI/train
# The on-disk extraction is incomplete. Read the complete local ZIP without another 13 GB copy.
dataset_archive: ../data/ASNR-MICCAI-BraTS2023-GLI-Challenge-TrainingData.zip
output_dir: ../outputs/brats2023_gli_cnn_mps_fixed
audit_report: ../outputs/brats2023_gli_audit/report.json
require_dataset_audit: true
patient_group_regex: '^(BraTS-GLI-\d+)-\d+$'  # Keep all scan suffixes of a subject in one split.
manifest: null  # Optional CSV: patient_id,t1,t1ce,t2,flair,seg; paths relative to dataset_root
modalities: [t1n, t1c, t2w, t2f]
modality_aliases:
  t1n: [t1n]
  t1c: [t1c]
  t2w: [t2w]
  t2f: [t2f]
segmentation_aliases: [seg]
# Observed directly in real masks; no label 4 conversion.
label_mapping: {0: 0, 1: 1, 2: 2, 3: 3}
regions: {WT: [1, 2, 3], TC: [1, 3], ET: [3], edema: [2]}
split_fractions: {expert_train: 0.55, controller_train: 0.20, validation: 0.15, test: 0.10}
split_file: splits/brats2023_gli_cases.json  # Frozen case IDs; shared subject prefixes never cross roles.
seed: 42
batch_size: 1
crop_size: [64, 64, 64]
highres_patch_size: [32, 32, 32]
patches_per_patient: 4
learning_rate: 0.0003
epochs: 50
controller_epochs: 20
validation_every_epochs: 5
early_stopping_patience: 8
num_workers: 0  # MPS boundary debugging; persistent_workers is explicitly false in code.
torch_threads: 4
log_every_steps: 10
save_every_steps: 100
trace_validation_transfers: false
traceback_interval_seconds: 600
mixed_precision: true  # CUDA only; MPS/CPU use float32
gradient_accumulation: 1
device: auto
model:
  width: 24
  feature_channels: 4
  dropout: 0.1
  unet_depth: 3
  transformer_backend: hierarchical  # hierarchical native 3D; tiny is an alias; swin is optional MONAI
  transformer_dim: 64
  transformer_heads: 4
  transformer_layers: 2
  transformer_window: 4
  transformer_grid: [4, 4, 4]  # retained for config compatibility; hierarchy uses /4 and /8
  swin_feature_size: 12
controller_width: 8
inference:
  overlap: 0.5
  mc_samples: 1  # >1 activates dropout; expensive
  uncertainty_threshold: 0.55
  highres_max_patches: 128  # null means no cap; coverage is reported, uncovered voxels abstain
  save_weights: true
evaluation:
  hd95: true  # final evaluation only; training validation stays Dice-only
  high_disagreement_threshold: 0.25
# Fifth expert is LLM reasoning, not a fifth voxel network. Default is explicit
# deterministic fallback for tests. Set mode: llm and BRATS_LLM_API_KEY to call a model.
reasoning:
  mode: deterministic
  provider: openai_compatible
  model: null
  api_key_env: BRATS_LLM_API_KEY
  base_url_env: BRATS_LLM_BASE_URL
  model_env: BRATS_LLM_MODEL
  timeout_seconds: 60
  max_disagreement_regions: 8
